<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #ffffff;
  color: #222222;
}

h1 {
  color: #ff2ae3;
  font-size: 36ptx;
  text-align: center;
}

.noteikumi {
  background-color: #fdaaf2;
  color: #222222;
  padding: 16px;
  border-radius: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 2px solid #94a3b8;
  background-color: #f8fafc;
 box-sizing: border-box;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 100%;
  text-align: center;
}

button {
  background-color: #f388ee;
  color: #ffffff;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>Priecīgais zinātnieks</h1>
<p>savākt 15 punktus</p>
<section class="noteikumi">
  <h2>Noteikumi.</h2>
  <p>Atbildi pareizi, lai iegūtu punktu.</p>
  <p>Uzvara ir pie 15 punktemi.</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
 <img src="atteli/varonis.png" alt="Spēles varonis" width="128">
  <p>Skaņas efekta nozīme spēlē:
    Šo skaņu dzirdēsi, kad atbilde ir pareiza
  </p>
<audio controls src="skanas/klikskis.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
